let mode='free',step=0,assigned={pronoun:null,fruit:null},lastDrag=0,passed=false;
function feedback(message='',kind=''){const n=document.getElementById('status');n.className='status '+kind;n.replaceChildren();if(!message)return;const face=document.createElement('span');face.className='face';face.textContent=kind==='retry'?'🤔':kind==='success'?'🤩':'💬';const words=document.createElement('span');words.className='feedback-text';words.textContent=message;n.append(face,words)}
const $=id=>document.getElementById(id);
const slots={pronoun:$('pronoun-slot'),fruit:$('fruit-slot')};
function dataFor(kind,id){return (kind==='fruit'?fruits:pronouns).find(x=>x.id===id)}
function newTile(kind,item,inSlot=false){
 const e=document.createElement('div');e.className='card '+(kind==='pronoun'?'pronoun':'');
 e.dataset.kind=kind;e.dataset.id=item.id;e.tabIndex=0;e.setAttribute('role','button');e.setAttribute('aria-label',item.name);
 e.innerHTML=kind==='fruit'?`<img alt="" src="${item.img}"><span class="label">${item.name}</span>`:`<span class="human" aria-hidden="true"><img alt="" src="${item.human}"></span><span class="label">${item.name}</span>`;
 if(!inSlot){e.draggable=true;e.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',kind+'|'+item.id);ev.dataTransfer.effectAllowed='copy'});e.addEventListener('pointerdown',ev=>pointerStart(ev,kind,item.id));e.addEventListener('click',()=>{if(Date.now()-lastDrag>350)assign(kind,item.id)})}
 else e.addEventListener('click',ev=>{ev.stopPropagation();clearSlot(kind)});
 e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();inSlot?clearSlot(kind):assign(kind,item.id)}});return e;
}
function render(){
 const challenge=mode==='story';
 for(const kind of ['pronoun','fruit']){
  const s=slots[kind];s.innerHTML='';s.classList.toggle('filled',!!assigned[kind] && !(challenge&&kind==='pronoun'));
  s.classList.toggle('fixed-name',challenge&&kind==='pronoun');
  if(challenge&&kind==='pronoun'){
   s.textContent=animals[step].id.toUpperCase();s.setAttribute('aria-label','Animal: '+animals[step].id);
  }else s.appendChild(assigned[kind]?newTile(kind,dataFor(kind,assigned[kind]),true):Object.assign(document.createElement('span'),{className:'placeholder',innerHTML:kind==='fruit'?'FRUIT<br>⬇':'HE / SHE<br>⬇'}));
  const bank=$(kind==='fruit'?'fruits':'pronouns');bank.innerHTML='';
  (kind==='fruit'?fruits:pronouns).forEach(item=>bank.appendChild(newTile(kind,item)));
 }
 $('story').classList.toggle('hidden',!challenge);
 document.querySelector('.banks').style.gridTemplateColumns=challenge?'1fr':'';
 document.querySelector('.banks').querySelector('.group').style.display=challenge?'none':'';
 $('check').style.display=challenge?'inline-block':'none';
 $('next').style.display=challenge&&passed?'inline-block':'none';
 if(challenge){const a=animals[step];$('animal').textContent=a.id.toUpperCase();$('character').innerHTML=`<img alt="${a.id} eating ${a.fruit}" src="${a.scene}">`;$('progress').textContent=`${step+1} / ${animals.length}`}
 if(mode==='free'&&assigned.pronoun&&assigned.fruit)feedback(assigned.fruit.length%2?'GOOD JOB!':'WELL DONE!','success');
 else if(!passed)feedback();
}
function assign(kind,id){if(!dataFor(kind,id)||passed||(mode==='story'&&kind==='pronoun'))return;assigned[kind]=id;render()}
function clearSlot(kind){if(passed||(mode==='story'&&kind==='pronoun'))return;assigned[kind]=null;render()}
for(const [kind,slot] of Object.entries(slots)){
 slot.addEventListener('dragover',ev=>{if(mode==='story'&&kind==='pronoun')return;ev.preventDefault();slot.classList.add('hover')});
 slot.addEventListener('dragleave',()=>slot.classList.remove('hover'));
 slot.addEventListener('drop',ev=>{ev.preventDefault();slot.classList.remove('hover');const [k,id]=ev.dataTransfer.getData('text/plain').split('|');if(kind===k)assign(kind,id)});
 slot.addEventListener('click',()=>{if(assigned[kind])clearSlot(kind)});
 slot.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&assigned[kind]){ev.preventDefault();clearSlot(kind)}});
}
function pointerStart(e,kind,id){if(e.pointerType==='mouse')return;const source=e.currentTarget,sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;function move(ev){if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){moved=true;ghost=source.cloneNode(true);ghost.classList.add('drag-ghost');document.body.appendChild(ghost)}if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';for(const s of Object.values(slots)){const r=s.getBoundingClientRect();s.classList.toggle('hover',ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)}}}function end(ev){source.removeEventListener('pointermove',move);source.removeEventListener('pointerup',end);source.removeEventListener('pointercancel',end);if(ghost){ghost.remove();lastDrag=Date.now();const s=slots[kind],r=s.getBoundingClientRect();if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)assign(kind,id)}Object.values(slots).forEach(s=>s.classList.remove('hover'))}source.addEventListener('pointermove',move);source.addEventListener('pointerup',end);source.addEventListener('pointercancel',end)}
function reset(){assigned={pronoun:null,fruit:null};passed=false;if('speechSynthesis'in window)speechSynthesis.cancel();render()}
function switchMode(m){mode=m;step=0;for(const btn of document.querySelectorAll('[data-mode]'))btn.classList.toggle('active',btn.dataset.mode===m);reset()}
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>switchMode(b.dataset.mode));
$('reset').addEventListener('click',reset);
$('check').addEventListener('click',()=>{
 if(!assigned.fruit){feedback('CHOOSE A FRUIT!');return}
 const a=animals[step];if(assigned.fruit===a.fruit){passed=true;feedback(step%2===0?'GOOD JOB!':'WELL DONE!','success');$('next').style.display='inline-block'}else feedback('TRY AGAIN!','retry');
});
$('next').addEventListener('click',()=>{if(!passed)return;if(step===animals.length-1){feedback('AMAZING! ALL DONE!','success');$('next').style.display='none';return}step++;reset()});
function bestEnglishVoice(locale){
 const voices=window.speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));
 const exact=voices.filter(v=>v.lang.replace('_','-').toLowerCase()===locale.toLowerCase());
 const candidates=exact.length?exact:voices;
 const quality=v=>(/natural|neural|enhanced|premium/i.test(v.name)?40:0)+(/google|microsoft|samantha|daniel|serena|sonia|aria|jenny/i.test(v.name)?20:0)+(v.localService?1:0);
 return [...candidates].sort((a,b)=>quality(b)-quality(a))[0]||null;
}
$('speak').addEventListener('click',()=>{
 if(!assigned.fruit||(mode==='free'&&!assigned.pronoun)){feedback('COMPLETE THE SENTENCE!');return}
 if(!('speechSynthesis'in window)){feedback('VOICE NOT AVAILABLE');return}
 const voice=bestEnglishVoice($('accent').value);
 if(!voice){feedback('NO ENGLISH VOICE FOUND');return}
 const subject=mode==='story'?animals[step].id:assigned.pronoun;
 const sentence=`${subject} likes ${assigned.fruit}.`;
 speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance(sentence);utt.voice=voice;utt.lang=voice.lang;utt.rate=.83;utt.pitch=1;speechSynthesis.speak(utt);
});
render();
</script></body></html>
